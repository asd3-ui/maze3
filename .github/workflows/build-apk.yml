name: Build and validate Maze 3D

on:
  push:
    branches: [main, mobile-ready-maze3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py entities.py maze_generator.py
      - name: Test maze generation and connectivity
        run: python -m unittest discover -s tests -v
      - name: Verify Android pygame recipe
        run: |
          python -m py_compile p4a-recipes/pygame/__init__.py
          grep -q 'version = "2.6.1"' p4a-recipes/pygame/__init__.py
          grep -q 'p4a.local_recipes = ./p4a-recipes' buildozer.spec

  android:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgdbm-dev libsqlite3-dev libbz2-dev
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "buildozer==1.5.0" "Cython==0.29.37"
          python -c "import Cython; print('Cython', Cython.__version__); assert Cython.__version__ == "0.29.37""
      - name: Build debug APK with patched pygame 2.6.1 recipe
        env:
          CI: "1"
        run: |
          buildozer -v android debug
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -size +0c -print -quit)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
      - name: Verify APK package
        run: |
          test -s "$APK"
          file "$APK"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: maze3d-android-apk
          path: bin/*.apk
          if-no-files-found: error
