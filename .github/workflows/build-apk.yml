name: Build and validate Maze 3D

on:
  push:
    branches: [main, mobile-ready-maze3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py entities.py maze_generator.py

  android:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgdbm-dev libsqlite3-dev libbz2-dev
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "buildozer==1.5.0" "Cython==0.29.36"
      - name: Build debug APK
        env:
          CI: "1"
        run: |
          buildozer -v android debug
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -size +0c -print -quit)"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: maze3d-android-apk
          path: bin/*.apk
          if-no-files-found: error
